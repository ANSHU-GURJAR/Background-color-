<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Slide Color Changer</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f9; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 10px; max-width: 800px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .controls { margin: 15px 0; background: #e9ecef; padding: 15px; border-radius: 8px; text-align: left; }
        input[type="file"], input[type="color"] { cursor: pointer; }
        input[type="range"] { width: 100%; cursor: pointer; }
        .slider-group { margin-bottom: 15px; }
        canvas { max-width: 100%; border: 2px dashed #ccc; cursor: crosshair; margin-top: 20px; border-radius: 5px; display: none; }
        h3 { margin-top: 0; color: #333; }
        .help-text { color: #d9534f; font-weight: bold; margin-bottom: 10px; text-align: center;}
        .btn-group { margin-top: 20px; display: flex; justify-content: center; gap: 10px; }
        button { background-color: #28a745; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; display: none; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Pro Slide Color Changer</h2>

        <div class="controls">
            <h3>Step 1: Upload Image</h3>
            <input type="file" id="uploadInput" accept="image/*">
        </div>

        <div class="controls">
            <h3>Step 2: Adjust Settings</h3>
            
            <div class="slider-group">
                <label><b>1. Naya Color Chunein:</b></label>
                <input type="color" id="newColorPicker" value="#b30000">
            </div>

            <div class="slider-group">
                <label><b>2. Tolerance:</b> (Kitna milta-julta rang badalna hai)</label>
                <input type="range" id="toleranceSlider" min="0" max="150" value="20">
            </div>

            <div class="slider-group">
                <label><b>3. Smooth Edges (Kinaare theek karne ke liye):</b> (Text ke safed daag hatane ke liye isko badhayein)</label>
                <input type="range" id="featherSlider" min="0" max="150" value="60">
            </div>
        </div>

        <p class="help-text" id="instructionText" style="display:none;">
            👉 Step 3: Niche photo mein us color par CLICK karein jise aap badalna chahte hain!
        </p>

        <!-- Buttons -->
        <div class="btn-group">
            <button id="downloadBtn">⬇️ Download HD Image</button>
        </div>

        <!-- Image Canvas -->
        <canvas id="imageCanvas"></canvas>
    </div>

    <script>
        const uploadInput = document.getElementById('uploadInput');
        const canvas = document.getElementById('imageCanvas');
        const ctx = canvas.getContext('2d');
        const newColorPicker = document.getElementById('newColorPicker');
        const toleranceSlider = document.getElementById('toleranceSlider');
        const featherSlider = document.getElementById('featherSlider');
        const instructionText = document.getElementById('instructionText');
        const downloadBtn = document.getElementById('downloadBtn');

        let originalImage = new Image();
        let originalImageData = null;

        // Image Load Handle
        uploadInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                originalImage.onload = function() {
                    // Original Resolution barkarar rakhein
                    canvas.width = originalImage.width;
                    canvas.height = originalImage.height;
                    
                    ctx.drawImage(originalImage, 0, 0);
                    originalImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    
                    canvas.style.display = "block";
                    instructionText.style.display = "block";
                    // Reset download button on new image
                    downloadBtn.style.display = "none";
                };
                originalImage.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function hexToRgb(hex) {
            const bigint = parseInt(hex.slice(1), 16);
            return [(bigint >> 16) & 255, (bigint >> 8) & 255, bigint & 255];
        }

        // Color Replacement Logic
        canvas.addEventListener('click', function(e) {
            if (!originalImageData) return;

            // Reset to original before applying new color
            ctx.putImageData(originalImageData, 0, 0);
            const currentImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = currentImageData.data;

            // Find clicked pixel coordinates
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = Math.floor((e.clientX - rect.left) * scaleX);
            const y = Math.floor((e.clientY - rect.top) * scaleY);

            // Get target color
            const clickPos = (y * canvas.width + x) * 4;
            const targetR = data[clickPos];
            const targetG = data[clickPos + 1];
            const targetB = data[clickPos + 2];

            const newRgb = hexToRgb(newColorPicker.value);
            const tolerance = parseInt(toleranceSlider.value);
            const feather = parseInt(featherSlider.value);

            // Replace colors with Edge Smoothing (Anti-aliasing fix)
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];

                const distance = Math.sqrt(
                    Math.pow(r - targetR, 2) + 
                    Math.pow(g - targetG, 2) + 
                    Math.pow(b - targetB, 2)
                );

                if (distance <= tolerance) {
                    // Fully replace color
                    data[i] = newRgb[0];
                    data[i + 1] = newRgb[1];
                    data[i + 2] = newRgb[2];
                } else if (feather > 0 && distance <= tolerance + feather) {
                    // Smoothly blend the edges
                    const mix = (distance - tolerance) / feather; // 0 to 1
                    data[i] = Math.round(r * mix + newRgb[0] * (1 - mix));
                    data[i + 1] = Math.round(g * mix + newRgb[1] * (1 - mix));
                    data[i + 2] = Math.round(b * mix + newRgb[2] * (1 - mix));
                }
            }

            ctx.putImageData(currentImageData, 0, 0);
            
            // Show download button after successful change
            downloadBtn.style.display = "block";
        });

        // High Quality Download
        downloadBtn.addEventListener('click', function() {
            const link = document.createElement('a');
            link.download = 'modified-slide.png';
            // Use image/png for lossless maximum quality (no pixelation)
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
